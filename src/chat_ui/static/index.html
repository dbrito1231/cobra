<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.O.B.R.A.</title>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
  <div id="app">
    <header id="top-bar" class="top-bar">
      <div class="top-bar-left">
        <span class="logo">C.O.B.R.A.</span>
        <div id="voice-indicator" class="voice-indicator voice-idle" title="Voice: Idle">
          <span class="voice-dot"></span>
          <span id="voice-label">Idle</span>
        </div>
      </div>
      <div class="top-bar-right">
        <span id="profile-name" class="profile-name">Default</span>
        <button id="search-button" class="btn btn-ghost" type="button" aria-label="Search">Search</button>
      </div>
    </header>

    <main id="main-layout" class="main-layout">
      <section id="chat-panel" class="panel chat-panel">
        <div id="chat-history" class="chat-history" aria-live="polite"></div>
        <form id="chat-form" class="chat-input-bar">
          <textarea id="chat-input" rows="1" placeholder="Message C.O.B.R.A..." aria-label="Message input"></textarea>
          <button id="send-button" class="btn btn-primary" type="submit">Send</button>
        </form>
      </section>

      <section id="wiki-panel" class="panel wiki-panel">
        <div class="wiki-toolbar">
          <button id="wiki-back" class="btn btn-ghost" type="button" hidden>← Back to index</button>
          <h2 id="wiki-title" class="wiki-title">Wiki</h2>
        </div>
        <div id="wiki-content" class="wiki-content"></div>
      </section>

      <aside id="status-panel" class="panel status-panel">
        <section class="status-section">
          <h3>Active Pipeline Step</h3>
          <div id="pipeline-status" class="pipeline-status">
            <span id="pipeline-label">Idle</span>
            <span id="pipeline-elapsed" class="pipeline-elapsed" hidden></span>
          </div>
        </section>
        <section class="status-section">
          <h3>Connected MCP Servers</h3>
          <ul id="mcp-list" class="mcp-list">
            <li class="mcp-empty">No MCP servers configured</li>
          </ul>
        </section>
        <section class="status-section">
          <h3>Proactive Items</h3>
          <div id="proactive-queue" class="proactive-queue">
            <p id="proactive-count">0 items queued</p>
            <p id="proactive-preview" class="proactive-preview">No items waiting</p>
            <button id="tell-me-now" class="btn btn-accent" type="button" disabled>Tell me now</button>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <div id="search-overlay" class="search-overlay" hidden>
    <div class="search-dialog">
      <div class="search-header">
        <input id="search-input" type="search" placeholder="Search all sessions..." autocomplete="off">
        <button id="search-close" class="btn btn-ghost" type="button" aria-label="Close search">✕</button>
      </div>
      <ul id="search-results" class="search-results"></ul>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
